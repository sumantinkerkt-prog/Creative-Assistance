<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essential Tools - With Navigation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #mainFrame {
            width: 100%;
            height: 100%;
            border: none;
        }
        #navBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999999;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #navBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(16, 185, 129, 0.6);
        }
        #navBtn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- Navigation Button -->
    <button id="navBtn" onclick="navigateToProjects()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
        Back to Projects
    </button>

    <!-- Main Content iframe -->
    <iframe id="mainFrame" src="file:///D:/W/code/flow/essential%20tools.html"></iframe>

    <script>
        function navigateToProjects() {
            window.location.href = 'file:///D:/W/code/flow/Upsworth%20Workflow%20with%20Nav.html';
        }
    </script>
</body>
</html>
