<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upsworth Workflow - With Navigation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #mainFrame {
            width: 100%;
            height: 100%;
            border: none;
        }
        #navBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999999;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #navBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6);
        }
        #navBtn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- Navigation Button -->
    <button id="navBtn" onclick="navigateToEssential()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        Essential Tools
    </button>

    <!-- Main Content iframe -->
    <iframe id="mainFrame" src="file:///D:/W/code/flow/Upsworth%20Workflow.html"></iframe>

    <script>
        function navigateToEssential() {
            window.location.href = 'file:///D:/W/code/flow/essential%20tools%20with%20nav.html';
        }
        
        // Load navigation fix into iframe
        window.addEventListener('load', function() {
            try {
                const iframe = document.getElementById('mainFrame');
                if (iframe && iframe.contentWindow) {
                    const script = iframe.contentDocument.createElement('script');
                    script.src = 'file:///D:/W/code/flow/navigation-fix-complete.js';
                    iframe.contentDocument.head.appendChild(script);
                    console.log('Navigation fix loaded into Upsworth Workflow');
                }
            } catch(e) {
                console.warn('Could not inject navigation fix:', e);
            }
        });
    </script>
</body>
</html>
