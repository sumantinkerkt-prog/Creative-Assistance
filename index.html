        const BookmarkManager = ({ data, onUpdate, showToast }) => {
            return (
                <div className="max-w-[1600px] mx-auto px-4 lg:px-8 py-8 animate-in h-[calc(100vh-64px)] flex flex-col">
                    <div className="flex justify-between items-end border-b border-slate-800/80 pb-3 shrink-0 mb-4">
                        <div>
                            <h2 className="text-3xl font-bold text-white tracking-tight">Resource Links</h2>
                            <p className="text-slate-400 mt-1">Global bookmarks and reference directories.</p>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto pb-20 no-scrollbar space-y-6">
                        {data.groups.map(group => (
                            <div key={group.id} className="bg-[#131B2C] rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.5)] border border-slate-800/80 p-6 transition-all hover:border-slate-700">
                                <h3 className="text-lg font-bold text-white mb-6 flex items-center border-b border-slate-800/60 pb-4">
                                    <span className="w-4 h-4 rounded-full mr-3 shadow-sm" style={{backgroundColor: group.color}}></span>
                                    {group.name}
                                </h3>
                                
                                {group.subgroups.map(sg => (
                                    <div key={sg.id} className="mb-6 last:mb-0">
                                        <h4 className="text-sm font-semibold text-slate-300 mb-1 ml-1">{sg.name}</h4>
                                        {sg.description && <p className="text-xs text-slate-500 mb-4 ml-1">{sg.description}</p>}
                                        
                                        <div className="space-y-0 divide-y divide-slate-800/60">
                                            {sg.links.map((link, idx) => (
                                                <div key={link.id} className={`py-3 px-1 group hover:bg-slate-800/30 transition-colors rounded-md ${idx === 0 ? 'pt-2' : ''} ${idx === sg.links.length - 1 ? 'pb-2' : ''}`}>
                                                    <div className="flex items-start justify-between gap-3">
                                                        <div className="flex-1 min-w-0">
                                                            <a href={link.type === 'web' ? ensureProtocol(link.url) : '#'} target="_blank" onClick={(e) => { if(link.type === 'local') { e.preventDefault(); openLocalFolder(link.url, showToast); } }} className={`font-medium text-sm block truncate ${link.type === 'local' ? 'text-indigo-400 hover:text-indigo-300' : 'text-slate-200 hover:text-indigo-400'}`}>
                                                                {link.type === 'local' ? <span className="flex items-center gap-1.5"><Icons.Folder /> {link.description || link.url}</span> : (link.description || formatUrl(link.url))}
                                                            </a>
                                                            <div className="text-[11px] text-slate-500 font-mono truncate mt-0.5">{formatUrl(link.url)}</div>
                                                        </div>
                                                        <div className="opacity-0 group-hover:opacity-100 transition-opacity flex gap-1 shrink-0">
                                                            <button onClick={() => copyToClipboard(link.url, showToast)} className="p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded transition-colors" title="Copy">
                                                                <Icons.Copy />
                                                            </button>
                                                        </div>
                                                    </div>
                                                    {link.tags && link.tags.length > 0 && <div className="mt-2"><TagsDisplay tags={link.tags} /></div>}

                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState(() => {
                try { const saved = localStorage.getItem('assetFlowPro_navState'); if (saved) { const parsed = JSON.parse(saved); if (parsed.activeTab) return parsed.activeTab; } } catch(e) {}
                return 'projects';
            });
            const [toastMsg, setToastMsg] = useState("");
            const [searchQuery, setSearchQuery] = useState("");
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const searchInputRef = useRef(null);
            
            const [snippetsData, setSnippetsData] = useState(defaultSnippets);
            const [palettesData, setPalettesData] = useState(defaultPalettes);
            const [bookmarksData, setBookmarksData] = useState(defaultBookmarks);
            const [projectsData, setProjectsData] = useState(defaultProjects);
            const [isLoaded, setIsLoaded] = useState(false);

            const [activeProjectId, setActiveProjectId] = useState(() => {
                try { const saved = localStorage.getItem('assetFlowPro_navState'); if (saved) { const parsed = JSON.parse(saved); if (parsed.activeProjectId) return parsed.activeProjectId; } } catch(e) {}
                return null;
            });
            const fileInputRef = useRef(null);

            const dragItemIndex = useRef(null);
            const dragOverItemIndex = useRef(null);

            const [sidebarExpandedProjects, setSidebarExpandedProjects] = useState({});

            useEffect(() => {
                let sData = defaultSnippets, pData = defaultPalettes, bData = defaultBookmarks, projData = defaultProjects;
                const unifiedData = localStorage.getItem('assetFlowPro_v9');
                if (unifiedData) {
                    try {
                        const parsed = JSON.parse(unifiedData);
                        if (parsed.snippets) sData = parsed.snippets;
                        if (parsed.palettes) pData = parsed.palettes;
                        if (parsed.bookmarks) bData = parsed.bookmarks;
                        if (parsed.projects) {
                            projData.projects = parsed.projects.projects.map(p => ({ ...p, tasks: p.tasks || [] }));
                        }
                    } catch (e) {}
                }
                setSnippetsData(sData); setPalettesData(pData); setBookmarksData(bData); setProjectsData(projData); setIsLoaded(true);
                
                if (projData.projects && projData.projects.length > 0) {
                    const savedProjectId = activeProjectId;
                    const savedProjectExists = savedProjectId && projData.projects.find(p => p.id === savedProjectId);
                    const targetProjectId = savedProjectExists ? savedProjectId : projData.projects[0].id;
                    setActiveProjectId(targetProjectId);
                    setSidebarExpandedProjects({ [targetProjectId]: true });
                }
                
                if (window.innerWidth < 1024) setIsSidebarOpen(false);
            }, []);

            useEffect(() => {
                if (projectsData.projects.length > 0 && !projectsData.projects.find(p => p.id === activeProjectId)) {
                    setActiveProjectId(projectsData.projects[0].id);
                }
            }, [projectsData.projects, activeProjectId]);

            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('assetFlowPro_v9', JSON.stringify({ snippets: snippetsData, palettes: palettesData, bookmarks: bookmarksData, projects: projectsData }));
                }
            }, [snippetsData, palettesData, bookmarksData, projectsData, isLoaded]);

            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('assetFlowPro_navState', JSON.stringify({ activeTab, activeProjectId }));
                }
            }, [activeTab, activeProjectId, isLoaded]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchInputRef.current?.focus(); }
                    if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
                        if (e.key === '1') { e.preventDefault(); setActiveTab('projects'); }
                        else if (e.key === '2') { e.preventDefault(); setActiveTab('tasks'); }
                        else if (e.key === '3') { e.preventDefault(); setActiveTab('snippets'); }
                        else if (e.key === '4') { e.preventDefault(); setActiveTab('palettes'); }
                        else if (e.key === '5') { e.preventDefault(); setActiveTab('bookmarks'); }
                    }
                    if (e.key === 'Escape' && searchQuery) { setSearchQuery(""); searchInputRef.current?.blur(); }
                };
                window.addEventListener('keydown', handleKeyDown); return () => window.removeEventListener('keydown', handleKeyDown);
            }, [searchQuery]);

            const showToast = (msg, type = "default") => { 
                setToastMsg({ text: msg, type }); 
                setTimeout(() => setToastMsg(""), 3000); 
            };
            window.showGlobalToast = showToast; 

            const handleExport = () => {
                const dataStr = JSON.stringify({ snippets: snippetsData, palettes: palettesData, bookmarks: bookmarksData, projects: projectsData }, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a'); link.href = url; link.download = `Workspace_Export_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
                showToast("Workspace exported successfully", "success");
            };

            const handleImport = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.snippets || parsed.palettes || parsed.bookmarks || parsed.projects) {
                            if (parsed.snippets) setSnippetsData(parsed.snippets);
                            if (parsed.palettes) setPalettesData(parsed.palettes);
                            if (parsed.bookmarks) setBookmarksData(parsed.bookmarks);
                            if (parsed.projects) {
                                const projD = parsed.projects;
                                projD.projects = projD.projects.map(p => ({...p, tasks: p.tasks || []}));
                                setProjectsData(projD);
                                if (projD.projects.length > 0) setActiveProjectId(projD.projects[0].id);
                            }
                            showToast("Workspace imported successfully", "success");
                        } else showToast("Invalid format.", "error");
                    } catch (err) { showToast("Error reading file.", "error"); }
                };
                reader.readAsText(file); e.target.value = ''; 
            };

            const triggerJump = (section, projId = null) => {
                const targetProjId = projId || activeProjectId || projectsData.projects[0]?.id;
                if (!targetProjId) return showToast("No projects available", "error");
                
                const needsDelay = activeTab !== 'projects';
                if (needsDelay) {
                    setActiveTab('projects');
                    setSearchQuery('');
                }
                
                setTimeout(() => {
                    window.dispatchEvent(new CustomEvent('jumpToSection', { detail: { projectId: targetProjId, section } }));
                }, needsDelay ? 150 : 0);
            };

            const toggleSidebarProject = (pId, e) => {
                if (e) e.stopPropagation();
                setSidebarExpandedProjects(prev => {
                    return prev[pId] ? {} : { [pId]: true };
                });
            };

            const handleDragStart = (e, index) => {
                dragItemIndex.current = index;
                setTimeout(() => e.target.classList.add('opacity-50'), 0);
            };

            const handleDragEnter = (e, index) => {
                dragOverItemIndex.current = index;
            };

            const handleDragEnd = (e) => {
                e.currentTarget.classList.remove('opacity-50');
                if (dragItemIndex.current !== null && dragOverItemIndex.current !== null && dragItemIndex.current !== dragOverItemIndex.current) {
                    const newProjects = [...projectsData.projects];
                    const draggedItemContent = newProjects.splice(dragItemIndex.current, 1)[0];
                    newProjects.splice(dragOverItemIndex.current, 0, draggedItemContent);
                    setProjectsData({ ...projectsData, projects: newProjects });
                }
                dragItemIndex.current = null;
                dragOverItemIndex.current = null;
            };

            if (!isLoaded) return null;

            const activeProject = projectsData.projects.find(p => p.id === activeProjectId);

            const NavItem = ({ id, icon: Icon, label, shortcut }) => {
                const isActive = activeTab === id && !searchQuery;

                        <div className="flex items-center space-x-3"><Icon /><span>{label}</span></div>
                        <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded border ${isActive ? 'border-indigo-400 bg-indigo-500/50 text-white' : 'border-slate-700 bg-[#131B2C] text-slate-500'}`}>⌘{shortcut}</span>
                    </button>

                    {/* PRIMARY SIDEBAR */}

                        <div className="h-16 flex items-center px-6 border-b border-slate-800/80 shrink-0">
                            <span 
                                className="text-xl font-bold text-teal-400"
                                title="Creative Assistance"
                            >Creative Assistance</span>
                        </div>
                        
                        <div className="flex-grow overflow-y-auto py-6 px-4 no-scrollbar">
                            
                            {/* SECTION 1: ACTIVE PROJECTS */}
                            {projectsData.projects.length > 0 && (
                                <div className="mb-6 pb-4 border-b border-slate-800/80">
                                    <h3 className="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 flex items-center justify-between">
                                        <span>Active Projects</span>
                                    </h3>
                                    <div className="space-y-1">
                                        {projectsData.projects.map((p, index) => {
                                            const isSelected = activeProjectId === p.id && activeTab === 'projects';
                                            const isExpanded = sidebarExpandedProjects[p.id] || false;

                                            return (
                                                <div 
                                                    key={p.id} 
                                                    className="flex flex-col group/projectitem relative transition-all"
                                                    draggable
                                                    onDragStart={(e) => handleDragStart(e, index)}
                                                    onDragEnter={(e) => handleDragEnter(e, index)}
                                                    onDragEnd={handleDragEnd}
                                                    onDragOver={(e) => e.preventDefault()}
                                                >
                                                    <div className={`w-full flex items-center justify-between px-2 py-2 rounded-lg text-sm transition-all ${isSelected ? 'bg-[#131B2C] shadow-sm text-white font-bold border border-slate-700/50' : 'text-slate-400 hover:bg-slate-800/40 hover:text-white font-medium border border-transparent'}`}>
                                                        
                                                        <div className="cursor-grab active:cursor-grabbing text-slate-600 hover:text-slate-400 px-1 opacity-0 group-hover/projectitem:opacity-100 transition-opacity">
                                                            <Icons.GripVertical />
                                                        </div>

                                                        <button 
                                                            onClick={() => {
                                                                setActiveProjectId(p.id);
                                                                setActiveTab('projects');
                                                                setSidebarExpandedProjects({ [p.id]: true });
                                                                window.dispatchEvent(new CustomEvent('jumpToSection', { detail: { projectId: p.id, section: 'header' } }));
                                                                if(window.innerWidth < 1024) setIsSidebarOpen(false);
                                                            }}
                                                            className="flex items-center min-w-0 flex-1 text-left ml-1"
                                                        >
                                                            <span className="w-2.5 h-2.5 rounded-full mr-3 shadow-sm shrink-0" style={{ backgroundColor: p.color, boxShadow: `0 0 8px ${p.color}60` }}></span>
                                                            <span className="truncate">{p.name}</span>
                                                        </button>
                                                        
                                                        <div className="flex items-center shrink-0 space-x-0.5">
                                                            <span className={`text-[10px] px-1.5 py-0.5 rounded-md font-bold mr-1 ${isSelected ? 'bg-slate-700 text-slate-300' : 'bg-slate-800 text-slate-500'}`}>{(p.tasks||[]).length}</span>
                                                            <button 
                                                                onClick={(e) => toggleSidebarProject(p.id, e)}
                                                                className="p-1 text-slate-500 hover:text-white hover:bg-slate-700 rounded transition-colors"
                                                            >
                                                                {isExpanded ? <Icons.ChevronDown /> : <Icons.ChevronRight />}
                                                            </button>
                                                        </div>
                                                    </div>
                                                    
                                                    {isExpanded && (
                                                        <div className="pl-9 pr-2 py-1.5 space-y-1.5 border-l border-slate-800 ml-5 animate-in mb-2 mt-1">
                                                            <button onClick={() => { setActiveTab('projects'); window.dispatchEvent(new CustomEvent('jumpToSection', { detail: { projectId: p.id, section: 'tasks' } })); if(window.innerWidth < 1024) setIsSidebarOpen(false); }} className="w-full text-left text-[11px] font-medium text-slate-500 hover:text-slate-300 py-1 transition flex items-center space-x-2">
                                                                <span className="w-1.5 h-1.5 bg-blue-500 rounded-full opacity-70"></span>
                                                                <span>Sprint Board</span>
                                                            </button>
                                                            <button onClick={() => { setActiveTab('projects'); window.dispatchEvent(new CustomEvent('jumpToSection', { detail: { projectId: p.id, section: 'colors' } })); if(window.innerWidth < 1024) setIsSidebarOpen(false); }} className="w-full text-left text-[11px] font-medium text-slate-500 hover:text-slate-300 py-1 transition flex items-center space-x-2">
                                                                <span className="w-1.5 h-1.5 bg-purple-500 rounded-full opacity-70"></span>
                                                                <span>Brand Colors</span>
                                                            </button>
                                                            <button onClick={() => { setActiveTab('projects'); window.dispatchEvent(new CustomEvent('jumpToSection', { detail: { projectId: p.id, section: 'snippets' } })); if(window.innerWidth < 1024) setIsSidebarOpen(false); }} className="w-full text-left text-[11px] font-medium text-slate-500 hover:text-slate-300 py-1 transition flex items-center space-x-2">
                                                                <span className="w-1.5 h-1.5 bg-emerald-500 rounded-full opacity-70"></span>
                                                                <span>Snippets</span>
                                                            </button>
                                                            <button onClick={() => { setActiveTab('projects'); window.dispatchEvent(new CustomEvent('jumpToSection', { detail: { projectId: p.id, section: 'bookmarks' } })); if(window.innerWidth < 1024) setIsSidebarOpen(false); }} className="w-full text-left text-[11px] font-medium text-slate-500 hover:text-slate-300 py-1 transition flex items-center space-x-2">
                                                                <span className="w-1.5 h-1.5 bg-rose-500 rounded-full opacity-70"></span>
                                                                <span>Resources</span>
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* SECTION 2: WORKSPACE */}
                            <div className="mb-8">
                                <h3 className="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Workspace</h3>
                                <NavItem id="projects" icon={Icons.Briefcase} label="Projects" shortcut="1" />
                                <NavItem id="tasks" icon={Icons.CheckSquare} label="All Tasks" shortcut="2" />
                            </div>

                            {/* SECTION 3: ESSENTIAL TOOLS */}
                            <div className="mb-8">
                                <h3 className="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Essential Tools</h3>
                                <button onClick={() => { window.location.href = 'essential tools with nav.html#analyzer'; }} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm transition-all duration-200 premium-active mb-1.5 text-slate-400 hover:bg-slate-800/40 hover:text-slate-200 font-medium border border-transparent`}>
                                    <div className="flex items-center space-x-3"><Icons.Search /><span>Analyzer</span></div>
                                    <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded border border-slate-700 bg-[#131B2C] text-slate-500`}>⌘3</span>
                                </button>
                                <button onClick={() => { window.location.href = 'essential tools with nav.html#text'; }} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm transition-all duration-200 premium-active mb-1.5 text-slate-400 hover:bg-slate-800/40 hover:text-slate-200 font-medium border border-transparent`}>
                                    <div className="flex items-center space-x-3"><Icons.AlignLeft /><span>Text Studio</span></div>
                                    <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded border border-slate-700 bg-[#131B2C] text-slate-500`}>⌘4</span>
                                </button>
                                <button onClick={() => { window.location.href = 'essential tools with nav.html#media'; }} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm transition-all duration-200 premium-active mb-1.5 text-slate-400 hover:bg-slate-800/40 hover:text-slate-200 font-medium border border-transparent`}>
                                    <div className="flex items-center space-x-3"><Icons.Image /><span>Media Ops</span></div>
                                    <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded border border-slate-700 bg-[#131B2C] text-slate-500`}>⌘5</span>
                                </button>
                            </div>
                        </div>

                        <div className="p-4 border-t border-slate-800/80 bg-[#131B2C] shrink-0">
                            <div className="flex items-center space-x-2 text-[10px] text-slate-400 font-bold mb-3 uppercase tracking-wider">
                                <Icons.CloudSync />
                                <span>Cloud Sync Enabled</span>
                            </div>
                            <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={handleImport} />
                            <div className="flex space-x-2">
                                <button onClick={() => fileInputRef.current.click()} className="flex-1 flex items-center justify-center space-x-2 text-xs font-semibold text-slate-300 bg-slate-800/50 border border-slate-700 rounded-lg py-2.5 hover:bg-slate-700 hover:text-white transition-colors shadow-sm"><Icons.Upload /> <span>Import</span></button>
                                <button onClick={handleExport} className="flex-1 flex items-center justify-center space-x-2 text-xs font-semibold text-slate-300 bg-slate-800/50 border border-slate-700 rounded-lg py-2.5 hover:bg-slate-700 hover:text-white transition-colors shadow-sm"><Icons.Download /> <span>Export</span></button>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 flex flex-col min-w-0 bg-[#0B101E] relative">
                        <header className="h-16 bg-[#0B101E] border-b border-slate-800/80 flex items-center justify-between px-4 sm:px-8 shrink-0 relative z-20">
                            <div className="flex items-center flex-1">
                                <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="lg:hidden p-2 -ml-2 mr-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-md transition-colors"><Icons.Menu /></button>
                                <div className="relative w-full max-w-xl group">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-indigo-400 transition-colors"><Icons.Search /></div>
                                    <input ref={searchInputRef} type="text" placeholder="Search projects, tasks, snippets..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="block w-full pl-11 pr-12 py-2.5 border border-slate-800/80 bg-[#0a0e17] rounded-xl text-sm text-white placeholder-slate-500 focus:bg-[#131B2C] focus:border-indigo-500/50 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all shadow-inner" />
                                    <div className="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none"><span className="text-[10px] font-mono font-bold text-slate-500 bg-slate-800 border border-slate-700 px-1.5 py-0.5 rounded shadow-sm">⌘K</span></div>
                                </div>
                            </div>
                        </header>

                        <div id="main-scroll-container" className="flex-1 overflow-y-auto relative h-full scroll-smooth">
                            {searchQuery ? (
                                <SearchResults query={searchQuery} projectsData={projectsData} snippetsData={snippetsData} bookmarksData={bookmarksData} palettesData={palettesData} showToast={showToast} />
                            ) : (
                                <div className="animate-in h-full relative">
                                    {activeTab === 'projects' && <ProjectManager data={projectsData} onUpdate={setProjectsData} showToast={showToast} activeProjectId={activeProjectId} setActiveProjectId={setActiveProjectId} />}
                                    {activeTab === 'tasks' && <GlobalTaskManager data={projectsData} onUpdate={setProjectsData} showToast={showToast} />}
                                    {activeTab === 'snippets' && <SnippetManager data={snippetsData} onUpdate={setSnippetsData} showToast={showToast} />}
                                    {activeTab === 'palettes' && <PaletteManager data={palettesData} onUpdate={setPalettesData} showToast={showToast} />}
                                    {activeTab === 'bookmarks' && <BookmarkManager data={bookmarksData} onUpdate={setBookmarksData} showToast={showToast} />}
                                </div>
                            )}
                        </div>
                    </main>

                    {toastMsg && (
                        <div className="fixed bottom-6 right-6 bg-slate-800 text-white px-5 py-3 rounded-xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.8)] z-[100] text-sm font-medium toast-animate flex items-center space-x-3 border border-slate-700">
                            <div className={`w-2 h-2 rounded-full shrink-0 ${toastMsg.type === 'success' ? 'bg-indigo-400 shadow-[0_0_8px_rgba(99,102,241,0.8)]' : 'bg-red-400 shadow-[0_0_8px_rgba(248,113,113,0.8)]'}`}></div>
                            <span>{toastMsg.text || toastMsg}</span>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body></html>
