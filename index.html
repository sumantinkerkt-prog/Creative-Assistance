    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']

                    boxShadow: {

                        'float': '0 10px 40px -10px rgba(0,0,0,0.5)',
                        'focus': '0 0 0 4px rgba(99, 102, 241, 0.2)',
                        'card': '0 4px 12px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2)',

                        nexa: {

                            surface: '#131B2C',

    <style>
        /* Global Reset & Premium Dark Scrollbars */
        html, body { height: 100%; overflow: hidden; background-color: #0B101E; color: #e2e8f0; }
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Text Truncation */
        .card-content-collapsed { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
        .task-title-collapsed { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        /* Content-first snippet card: 4-line clamp, no inner box */
        .line-clamp-4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* High-End Animations */
        @keyframes subtleFadeInUp { from { opacity: 0; transform: translateY(6px) scale(0.995); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-in { animation: subtleFadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .toast-animate { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .premium-hover { transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .premium-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5); border-color: #334155; }
        .premium-active:active { transform: translateY(0) scale(0.98); }

        .enterprise-input { background: #131B2C; border: 1px solid #1E293B; color: #f8fafc; transition: all 0.2s ease; }
        .enterprise-input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); outline: none; }

        .kanban-drop-zone.drag-over { background-color: rgba(30, 41, 59, 0.4); border-color: #475569; border-style: dashed; box-shadow: inset 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .task-card-dragging { opacity: 0.4; transform: scale(0.95) rotate(2deg); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

        /* ── Compact Layout Overrides ── */

        /* Sidebar & topbar: shrink from 64px to 48px */
        .h-16 { height: 3rem !important; }

        /* Main view wrappers: py-8 → py-3 */
        .py-8 { padding-top: 0.75rem !important; padding-bottom: 0.75rem !important; }
        .py-10 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
        .py-6 { padding-top: 0.5rem !important; padding-bottom: 0.5rem !important; }

        /* Horizontal padding: px-8, px-10 → tighter */
        .px-8 { padding-left: 1rem !important; padding-right: 1rem !important; }
        .lg\:px-8 { padding-left: 1rem !important; padding-right: 1rem !important; }
        .lg\:px-10 { padding-left: 1.25rem !important; padding-right: 1.25rem !important; }

        /* Section inner padding: p-6 → p-3, p-8 → p-4 */
        .p-6 { padding: 0.75rem !important; }
        .p-8 { padding: 1rem !important; }
        .p-5 { padding: 0.625rem !important; }

        /* Vertical gaps between items */
        .space-y-6 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.75rem !important; }
        .space-y-5 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.625rem !important; }
        .space-y-4 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.5rem !important; }

        /* Card grid gap */
        .gap-5 { gap: 0.75rem !important; }
        .gap-4 { gap: 0.5rem !important; }

        /* Bottom margins */
        .mb-8 { margin-bottom: 1rem !important; }
        .mb-6 { margin-bottom: 0.75rem !important; }

        /* Large bottom padding (scroll spacer) */
        .pb-40 { padding-bottom: 2rem !important; }

        /* Adjust content area height to match shrunk header */
        .h-\[calc\(100vh-64px\)\] { height: calc(100vh - 48px) !important; }
        .h-\[calc\(100vh-220px\)\] { height: calc(100vh - 170px) !important; }
        .lg\:h-\[calc\(100vh-140px\)\] { height: calc(100vh - 100px) !important; }

        /* Sidebar nav items: tighten inner padding */
        .px-6 { padding-left: 0.875rem !important; padding-right: 0.875rem !important; }
        .py-5 { padding-top: 0.5rem !important; padding-bottom: 0.5rem !important; }

                                    <Icons.Folder /> <span>Local</span>
                                </button>

                            {task.webUrl && (

                                    <Icons.ExternalLink /> <span>Web</span>
                                </button>

                    <div className="flex justify-between items-end mt-3 border-t border-slate-800/50 pt-3">

                            {task.tags?.length > 2 && <span className="text-[9px] font-bold text-slate-500">+{task.tags.length - 2}</span>}
                        </div>
                        <div className="flex items-center space-x-2 shrink-0">
                            {task.timeSpent && (

                                    <Icons.Hourglass /> <span className="ml-1">{task.timeSpent}</span>
                                </span>
                            )}
                            {task.dueDate && <span className={`text-[10px] font-medium flex items-center ${new Date(task.dueDate) < new Date() && task.status !== 'done' && task.status !== 'archive' ? 'text-red-400' : 'text-slate-500'}`}><Icons.Clock /> <span className="ml-1">{new Date(task.dueDate).toLocaleDateString('en-US', {month:'short', day:'numeric'})}</span></span>}
                            {task.assignee && (
                                <div 
                                    className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold ${getAvatarColor(task.assignee)} shadow-sm border border-slate-700/80`} 
                                    title={`Assignee: ${task.assignee}${task.assignedBy ? `\nAssigned By: ${task.assignedBy}` : ''}`}
                                >
                                    {getInitials(task.assignee)}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const KanbanBoard = ({ tasks, projectsMap, onUpdateStatus, onEditTask, onAddTask }) => {
            const [expandedArchiveMonths, setExpandedArchiveMonths] = useState({});

            const handleDragOver = (e) => { e.preventDefault(); const dropZone = e.currentTarget; if (!dropZone.classList.contains('drag-over')) dropZone.classList.add('drag-over'); };
            const handleDragLeave = (e) => e.currentTarget.classList.remove('drag-over');
            const handleDrop = (e, newStatus) => {
                e.preventDefault(); e.currentTarget.classList.remove('drag-over');
                const taskId = e.dataTransfer.getData('taskId');
                const sourceProjectId = e.dataTransfer.getData('sourceProjectId');
                const sourceStatus = e.dataTransfer.getData('sourceStatus');
                if (sourceStatus !== newStatus && taskId && sourceProjectId) onUpdateStatus(sourceProjectId, taskId, newStatus);
            };

            const toggleArchiveMonth = (month) => {
                setExpandedArchiveMonths(prev => ({ ...prev, [month]: prev[month] === false ? true : false }));
            };

            return (
                <div className="flex space-x-3 overflow-x-auto pb-3 px-1 items-start pt-1 [&::-webkit-scrollbar]:h-1.5 [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-slate-700/50 hover:[&::-webkit-scrollbar-thumb]:bg-slate-600 [&::-webkit-scrollbar-thumb]:rounded-full snap-x">
                    {Object.entries(STATUSES).map(([statusKey, statusInfo]) => {
                        const columnTasks = tasks.filter(t => t.status === statusKey);
                        
                        const sortedColumnTasks = [...columnTasks].sort((a, b) => {
                            const dateA = new Date(a.dueDate || a.dateAdded || 0);
                            const dateB = new Date(b.dueDate || b.dateAdded || 0);
                            return dateA - dateB;
                        });

                        return (
                            <div key={statusKey} className="w-[85vw] sm:w-[260px] min-w-[220px] max-w-[320px] shrink-0 flex flex-col snap-center">
                                {/* Column header */}
                                <div className="flex items-center justify-between mb-2 px-1 shrink-0">
                                    <div className="flex items-center space-x-2">
                                        <span className={`px-2.5 py-0.5 rounded-full text-[10px] flex items-center font-bold tracking-wide ${statusInfo.color}`}>
                                            {statusKey === 'todo' && <Icons.CheckSquare />}
                                            {statusKey === 'in_progress' && <Icons.Clock />}
                                            {statusKey === 'review' && <Icons.Search />}
                                            {statusKey === 'done' && <Icons.CheckSquare />}
                                            {statusKey === 'archive' && <Icons.Folder />}
                                            <span className="ml-1">{statusInfo.label}</span>
                                        </span>
                                        <span className="text-[10px] font-semibold text-slate-500 bg-slate-800/60 px-1.5 py-0.5 rounded-full">{columnTasks.length}</span>
                                    </div>
                                    {statusKey !== 'archive' && (
                                        <button onClick={() => onAddTask(statusKey)} className="p-1 text-slate-500 hover:text-white hover:bg-slate-800/80 rounded-md transition" title="Add Task"><Icons.Plus /></button>
                                    )}
                                </div>
                                {/* Column body — auto height, not viewport-locked */}
                                <div className={`rounded-xl border border-slate-800/60 bg-[#0a0e17] p-2 kanban-drop-zone transition-colors flex flex-col ${statusKey !== 'archive' ? 'space-y-2' : ''}`} onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={(e) => handleDrop(e, statusKey)}>
                                    
                                    {statusKey === 'archive' ? (
                                        <div className="space-y-2">
                                            {(() => {
                                                if (sortedColumnTasks.length === 0) {
                                                    return <div className="border border-dashed border-slate-700/70 w-full rounded-xl flex items-center justify-center text-xs font-medium text-slate-600 py-4 pointer-events-none">Drop tasks here to archive</div>;
                                                }

                                                const groupedTasks = sortedColumnTasks.reduce((acc, task) => {
                                                    let monthStr = 'Archived';
                                                    let targetDate = task.dateAdded ? new Date(task.dateAdded) : new Date();
                                                    if (!isNaN(targetDate.getTime())) {
                                                        const month = targetDate.toLocaleString('en-US', { month: 'short' });
                                                        const year = targetDate.getFullYear();
                                                        monthStr = `${month} ${year}`;
                                                    }
                                                    if (!acc[monthStr]) acc[monthStr] = [];
                                                    acc[monthStr].push(task);
                                                    return acc;
                                                }, {});

                                                return Object.entries(groupedTasks).map(([month, mTasks]) => (
                                                    <div key={month} className="rounded-xl overflow-hidden">
                                                        <div onClick={(e) => { e.stopPropagation(); toggleArchiveMonth(month); }} className="flex justify-between items-center px-3 py-2 bg-slate-800/40 border border-slate-800 hover:border-slate-700 rounded-xl cursor-pointer hover:bg-slate-800/60 transition-all">
                                                            <div className="flex items-center space-x-2 text-xs font-bold text-slate-300">
                                                                <div className="text-slate-500">{expandedArchiveMonths[month] === false ? <Icons.ChevronRight /> : <Icons.ChevronDown />}</div>
                                                                <Icons.Folder />
                                                                <span>{month}</span>
                                                            </div>
                                                            <span className="text-slate-500 text-[10px] font-bold">{mTasks.length}</span>
                                                        </div>
                                                        {expandedArchiveMonths[month] !== false && (
                                                            <div className="pt-2 space-y-2 pl-2 border-l-2 border-slate-800/50 ml-4 mt-1">
                                                                {mTasks.map(task => <KanbanCard key={task.id} task={task} projectName={projectsMap ? projectsMap[task.projectId]?.name : null} onEdit={() => onEditTask(task)} />)}
                                                            </div>
                                                        )}
                                                    </div>
                                                ));
                                            })()}
                                        </div>
                                    ) : (
                                        <>
                                            {sortedColumnTasks.map(task => <KanbanCard key={task.id} task={task} projectName={projectsMap ? projectsMap[task.projectId]?.name : null} onEdit={() => onEditTask(task)} />)}
                                            {sortedColumnTasks.length === 0 && (
                                                <div className="border border-dashed border-slate-700/50 w-full rounded-lg flex items-center justify-center text-xs text-slate-600 py-5 pointer-events-none">
                                                    Drop tasks here
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        const SearchResults = ({ query, projectsData, snippetsData, bookmarksData, palettesData, showToast }) => {
            const lowerQuery = query.toLowerCase();

            const matchedProjects = projectsData.projects.filter(p => p.name.toLowerCase().includes(lowerQuery));
            
            const matchedSnippets = [];
            snippetsData.cards.forEach(c => { if (c.title.toLowerCase().includes(lowerQuery) || c.content.toLowerCase().includes(lowerQuery) || (c.tags && c.tags.some(t => t.toLowerCase().includes(lowerQuery)))) matchedSnippets.push({ ...c, source: 'Global Library' }); });
            projectsData.projects.forEach(p => { p.snippets.forEach(c => { if (c.title.toLowerCase().includes(lowerQuery) || c.content.toLowerCase().includes(lowerQuery) || (c.tags && c.tags.some(t => t.toLowerCase().includes(lowerQuery)))) matchedSnippets.push({ ...c, source: `Project: ${p.name}` }); }); });

            const matchedLinks = [];
            bookmarksData.groups.forEach(g => { g.subgroups.forEach(sg => { sg.links.forEach(l => { if (l.url.toLowerCase().includes(lowerQuery) || l.description.toLowerCase().includes(lowerQuery) || (l.tags && l.tags.some(t => t.toLowerCase().includes(lowerQuery)))) matchedLinks.push({ ...l, source: `Global: ${g.name} > ${sg.name}` }); }); }); });
            projectsData.projects.forEach(p => { p.bookmarks.forEach(c => { c.links.forEach(l => { if (l.url.toLowerCase().includes(lowerQuery) || l.description.toLowerCase().includes(lowerQuery) || (l.tags && l.tags.some(t => t.toLowerCase().includes(lowerQuery)))) matchedLinks.push({ ...l, source: `Project: ${p.name} > ${c.name}` }); }); }); });

            const matchedTasks = [];
            projectsData.projects.forEach(p => {
                (p.tasks || []).forEach(t => {
                    if (t.title.toLowerCase().includes(lowerQuery) || t.description.toLowerCase().includes(lowerQuery) || (t.assignee && t.assignee.toLowerCase().includes(lowerQuery)) || (t.tags && t.tags.some(tag => tag.toLowerCase().includes(lowerQuery)))) {
                        matchedTasks.push({ ...t, source: p.name });
                    }
                });
            });

            const hasResults = matchedProjects.length > 0 || matchedSnippets.length > 0 || matchedLinks.length > 0 || matchedTasks.length > 0;

            return (
                <div className="max-w-[1600px] mx-auto px-6 lg:px-10 py-10 animate-in space-y-8">
                    <h2 className="text-2xl font-bold text-white mb-2">Search Results</h2>
                    <p className="text-sm text-slate-400 mb-6">Showing matches for "{query}"</p>

                    {!hasResults && (
                        <div className="text-center py-20 bg-[#131B2C] border border-dashed border-slate-800 rounded-2xl">
                            <div className="text-slate-600 flex justify-center mb-4"><Icons.Search /></div>
                            <h3 className="text-lg font-medium text-slate-300">No results found</h3>
                        </div>
                    )}

                    <div className="space-y-12">
                        {matchedTasks.length > 0 && (
                            <section>
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4 border-b border-slate-800 pb-2">Tasks ({matchedTasks.length})</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {matchedTasks.map((t, i) => <KanbanCard key={i} task={t} projectName={t.source} onEdit={() => {}} />)}
                                </div>
                            </section>
                        )}
                        
                        {matchedProjects.length > 0 && (
                            <section>
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4 border-b border-slate-800 pb-2">Projects ({matchedProjects.length})</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {matchedProjects.map(p => (
                                        <div key={p.id} className="bg-[#131B2C] border border-slate-800/80 p-4 rounded-xl shadow-sm flex items-center space-x-4 hover:border-slate-600 transition-colors">
                                            <div className="w-4 h-full rounded-full shadow-sm" style={{ backgroundColor: p.color, boxShadow: `0 0 8px ${p.color}60` }}></div>
                                            <div><h4 className="font-semibold text-white">{p.name}</h4></div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        )}

                        {matchedSnippets.length > 0 && (
                            <section>
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4 border-b border-slate-800 pb-2">Snippets ({matchedSnippets.length})</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {matchedSnippets.map((s, i) => <PremiumSnippetCard key={i} card={s} onCopy={() => copyToClipboard(s.content, showToast)} readOnly sourceLabel={s.source} />)}
                                </div>
                            </section>
                        )}

                        {matchedLinks.length > 0 && (
                            <section>
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4 border-b border-slate-800 pb-2">Resources ({matchedLinks.length})</h3>
                                <div className="bg-[#131B2C] border border-slate-800/80 rounded-xl overflow-hidden shadow-sm">
                                    {matchedLinks.map((l, i) => {
                                        const isLocal = l.type === 'local';
                                        return (
                                            <div key={i} className={`flex justify-between items-center p-4 border-b last:border-0 group border-slate-800/80 hover:bg-[#1A2333] transition-colors`}>
                                                <div className="min-w-0 pr-4 flex-1">
                                                    <div className="flex items-center space-x-2">
                                                        {isLocal ? (
                                                            <button onClick={() => openLocalFolder(l.url, showToast)} className="font-semibold text-sm text-indigo-400 hover:text-indigo-300 flex items-center text-left truncate">
                                                                <Icons.Folder /> <span className="ml-1.5 truncate">{l.description || l.url}</span>
                                                            </button>
                                                        ) : (
                                                            <a href={ensureProtocol(l.url)} target="_blank" rel="noopener noreferrer" className="font-semibold text-sm text-white hover:text-indigo-400 truncate">{l.description || formatUrl(l.url)}</a>
                                                        )}
                                                        <span className={`text-[10px] px-1.5 rounded whitespace-nowrap shrink-0 ${isLocal ? 'bg-indigo-900/30 text-indigo-300 border border-indigo-800/50' : 'bg-[#0a0e17] text-slate-400 border border-slate-700/80'}`}>{l.source}</span>
                                                    </div>
                                                    <div className="text-xs text-slate-500 font-mono truncate mt-1">{isLocal ? l.url : formatUrl(l.url)}</div>
                                                </div>
                                                <div className="flex items-center space-x-2 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                                                    <button onClick={() => copyToClipboard(l.url, showToast)} className="p-1.5 bg-[#0a0e17] border border-slate-700 shadow-sm rounded text-slate-400 hover:text-white"><Icons.Copy/></button>
                                                    {!isLocal && <a href={ensureProtocol(l.url)} target="_blank" rel="noopener noreferrer" className="p-1.5 bg-[#0a0e17] border border-slate-700 shadow-sm rounded text-slate-400 hover:text-white"><Icons.ExternalLink/></a>}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </section>
                        )}
                    </div>
                </div>
            );
        };

        const GlobalTaskManager = ({ data, onUpdate, showToast }) => {
            const { projects } = data;
            const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
            const [editingTask, setEditingTask] = useState(null);

            const allTasks = useMemo(() => {
                let flat = []; projects.forEach(p => { if(p.tasks) flat = [...flat, ...p.tasks.map(t => ({...t, projectId: p.id}))]; }); return flat;
            }, [projects]);

            const projectsMap = useMemo(() => { const map = {}; projects.forEach(p => map[p.id] = p); return map; }, [projects]);

            const updateTaskStatus = (projectId, taskId, newStatus) => onUpdate({...data, projects: projects.map(p => p.id === projectId ? {...p, tasks: p.tasks.map(t => t.id === taskId ? {...t, status: newStatus} : t)} : p)});
            const saveTask = (tData) => { onUpdate({ ...data, projects: projects.map(p => { if (p.id === tData.projectId) { const newTasks = tData.id ? p.tasks.map(t => t.id === tData.id ? tData : t) : [...(p.tasks || []), { ...tData, id: generateId(), dateAdded: getToday() }]; return { ...p, tasks: newTasks }; } return p; }) }); setIsTaskModalOpen(false); setEditingTask(null); };
            const deleteTask = (projectId, taskId) => { onUpdate({...data, projects: projects.map(p => p.id === projectId ? {...p, tasks: p.tasks.filter(t => t.id !== taskId)} : p)}); setIsTaskModalOpen(false); setEditingTask(null); };

            return (
                <div className="max-w-[1600px] mx-auto px-4 lg:px-8 py-8 animate-in h-[calc(100vh-64px)] flex flex-col">
                    <div className="flex justify-between items-end border-b border-slate-800/80 pb-3 shrink-0 mb-4">
                        <div><h2 className="text-3xl font-bold text-white tracking-tight">Global Tasks</h2><p className="text-slate-400 mt-1">Cross-project task management.</p></div>
                        <button onClick={() => { setEditingTask(null); setIsTaskModalOpen(true); }} className="flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl transition-all shadow-[0_0_15px_rgba(99,102,241,0.4)] border border-indigo-500/50 premium-active font-semibold">
                            <Icons.Plus /> <span>New Task</span>
                        </button>
                    </div>

                    {projects.length === 0 ? (
                        <div className="flex-1 flex flex-col items-center justify-center text-center py-20">
                            <div className="text-slate-600 mb-4"><Icons.CheckSquare /></div>
                            <h3 className="text-lg font-medium text-slate-300">No Projects Found</h3>
                            <p className="text-sm text-slate-500 mb-4">Create a project first to start tracking tasks.</p>
                        </div>
                    ) : (
                        <div className="flex-1 overflow-hidden min-h-0">
                            <KanbanBoard tasks={allTasks} projectsMap={projectsMap} onUpdateStatus={updateTaskStatus} onEditTask={(task) => { setEditingTask(task); setIsTaskModalOpen(true); }} onAddTask={(status) => { setEditingTask({ status }); setIsTaskModalOpen(true); }} />
                        </div>
                    )}

                    {isTaskModalOpen && <TaskFormModal task={editingTask?.id ? editingTask : null} defaultStatus={editingTask?.status} projects={projects} onClose={() => setIsTaskModalOpen(false)} onSave={saveTask} onDelete={deleteTask} />}
                </div>
            );
        };

        // ─── SnippetsWorkspace ────────────────────────────────────────────────────
        // Compact knowledge-base view: left category rail + right 3-col grid
        // With full category management: create, rename, delete, assign, move
        const SnippetsWorkspace = ({ snippets, projectId, categories=[], onNew, onEdit, onDelete, onCopy, onView, onUpdateCategories, onMoveSnippet }) => {
            const [search, setSearch] = useState('');
            const [activeCat, setActiveCat] = useState('all');
            const [sort, setSort] = useState('recent');
            const [newCatInput, setNewCatInput] = useState('');
            const [isCreatingCat, setIsCreatingCat] = useState(false);
            const [contextMenuCat, setContextMenuCat] = useState(null);
            const [moveMenuSnippet, setMoveMenuSnippet] = useState(null);

            // Ensure uncategorized always exists
            const allCategories = !categories.some(c => c.id === 'uncategorized') 
                ? [...categories, { id: 'uncategorized', name: 'Uncategorized' }]
                : categories;

            // Count snippets per category
            const countByCategory = (catId) => {
                return snippets.filter(s => (s.category || 'uncategorized') === catId).length;
            };

            // Handle new category creation
            const handleCreateCategory = () => {
                if (!newCatInput.trim()) return;
                const newCat = { id: generateId(), name: newCatInput.trim() };
                onUpdateCategories([...allCategories, newCat]);
                setNewCatInput('');
                setIsCreatingCat(false);
            };

            // Handle category rename
            const handleRenameCategory = (catId, newName) => {
                if (!newName.trim() || newName === contextMenuCat?.origName) {
                    setContextMenuCat(null);
                    return;
                }
                onUpdateCategories(allCategories.map(c => c.id === catId ? { ...c, name: newName.trim() } : c));
                setContextMenuCat(null);
            };

            // Handle category deletion
            const handleDeleteCategory = (catId) => {
                if (catId === 'uncategorized') return; // Cannot delete uncategorized
                const count = countByCategory(catId);
                if (count > 0) {
                    // Move all snippets to uncategorized
                    const updatedSnippets = snippets.map(s => s.category === catId ? { ...s, category: 'uncategorized' } : s);
                    // This would be handled by parent component; for now just filter out category
                    onUpdateCategories(allCategories.filter(c => c.id !== catId));
                    // Notify parent to update snippets via onMoveSnippet or similar
                } else {
                    onUpdateCategories(allCategories.filter(c => c.id !== catId));
                }
                setContextMenuCat(null);
            };

            const filtered = snippets.filter(s => {
                const sCategory = s.category || 'uncategorized';
                const matchCat = activeCat === 'all' || sCategory === activeCat;
                const q = search.toLowerCase();
                const matchQ = !q || s.title.toLowerCase().includes(q) || s.content.toLowerCase().includes(q) || (s.tags||[]).some(t => t.toLowerCase().includes(q));
                return matchCat && matchQ;
            }).sort((a, b) => sort === 'alpha'
                ? a.title.localeCompare(b.title)
                : (new Date(b.dateAdded||0) - new Date(a.dateAdded||0))
            );

            return (
                <div className="flex h-full min-h-0">
                    {/* ── Category rail (left) ─────────────────────────────── */}
                    <div className="w-48 shrink-0 border-r border-slate-800/60 flex flex-col py-2 overflow-y-auto no-scrollbar">
                        <div className="px-3 mb-1">
                            <span className="text-[9px] font-bold text-slate-600 uppercase tracking-widest">Snippets</span>
                        </div>

                        {/* All */}
                        <button onClick={() => setActiveCat('all')}
                            className={`flex items-center justify-between px-3 py-1 text-xs transition-colors w-full ${activeCat === 'all' ? 'text-white font-semibold' : 'text-slate-500 hover:text-slate-300'}`}>
                            <span>All</span>
                            <span className={`text-[9px] font-bold tabular-nums ${activeCat === 'all' ? 'text-indigo-400' : 'text-slate-600'}`}>{snippets.length}</span>
                        </button>

                        {/* Categories section */}
                        {allCategories.length > 0 && (
                            <div className="mt-2 px-3 mb-1 flex items-center justify-between">
                                <span className="text-[9px] font-bold text-slate-600 uppercase tracking-widest">Categories</span>
                            </div>
                        )}
                        {allCategories.map(cat => (
                            <div key={cat.id} className="group relative">
                                <button onClick={() => setActiveCat(cat.id)} className={`flex items-center justify-between px-3 py-1 text-xs transition-colors w-full text-left ${activeCat === cat.id ? 'text-white font-semibold' : 'text-slate-500 hover:text-slate-300'}`}>
                                    <div className="flex items-center gap-1.5 min-w-0">
                                        {activeCat === cat.id && <div className="w-1 h-1 rounded-full bg-indigo-400 shrink-0"></div>}
                                        <span className="truncate">{cat.name}</span>
                                    </div>
                                    <span className={`text-[9px] font-bold tabular-nums shrink-0 ${activeCat === cat.id ? 'text-indigo-400' : 'text-slate-600'}`}>{countByCategory(cat.id)}</span>
                                </button>
                                {cat.id !== 'uncategorized' && (
                                    <button onClick={() => setContextMenuCat({ id: cat.id, origName: cat.name })}
                                        className="absolute right-1 top-1 p-0.5 text-slate-600 hover:text-slate-300 opacity-0 group-hover:opacity-100 transition rounded text-xs">
                                        <Icons.MoreVertical />
                                    </button>
                                )}
                                {/* Context menu */}
                                {contextMenuCat?.id === cat.id && (
                                    <div className="absolute right-6 top-0 bg-[#131B2C] border border-slate-700 rounded-lg shadow-lg z-50 w-32">
                                        <button onClick={() => {
                                            const newName = prompt('Rename category:', cat.name);
                                            if (newName) handleRenameCategory(cat.id, newName);
                                        }} className="w-full text-left text-xs px-3 py-1.5 text-slate-300 hover:bg-slate-800 hover:text-white transition">
                                            Rename
                                        </button>
                                        <button onClick={() => handleDeleteCategory(cat.id)} className="w-full text-left text-xs px-3 py-1.5 text-red-400 hover:bg-red-900/20 transition border-t border-slate-800">
                                            Delete
                                        </button>
                                        <button onClick={() => setContextMenuCat(null)} className="w-full text-left text-xs px-3 py-1.5 text-slate-500 hover:text-slate-300 transition border-t border-slate-800">
                                            Close
                                        </button>
                                    </div>
                                )}
                            </div>
                        ))}

                        {/* New Category */}
                        {isCreatingCat ? (
                            <div className="px-2 py-1.5 mt-2 border-t border-slate-800/60">
                                <input type="text" value={newCatInput} onChange={e => setNewCatInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') handleCreateCategory(); if (e.key === 'Escape') setIsCreatingCat(false); }}
                                    placeholder="Category name…"
                                    autoFocus
                                    className="w-full text-xs px-2 py-1 bg-[#0a0e17] border border-slate-800 rounded mb-1 text-white placeholder-slate-600 focus:border-slate-600 outline-none" />
                                <div className="flex gap-1">
                                    <button onClick={handleCreateCategory} className="flex-1 text-[9px] font-semibold bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-0.5 rounded transition">Create</button>
                                    <button onClick={() => { setIsCreatingCat(false); setNewCatInput(''); }} className="flex-1 text-[9px] font-semibold bg-slate-700 hover:bg-slate-600 text-slate-100 px-2 py-0.5 rounded transition">Cancel</button>
                                </div>
                            </div>
                        ) : (
                            <div className="mt-auto px-3 pt-2 border-t border-slate-800/60 space-y-1">
                                <button onClick={() => setIsCreatingCat(true)}
                                    className="w-full flex items-center justify-center gap-1 text-[10px] font-semibold text-slate-500 hover:text-white border border-dashed border-slate-700 hover:border-slate-500 rounded-lg py-1.5 transition">
                                    <Icons.Plus /> New Category
                                </button>
                                <button onClick={onNew}
                                    className="w-full flex items-center justify-center gap-1 text-[10px] font-semibold text-slate-500 hover:text-white border border-dashed border-slate-700 hover:border-slate-500 rounded-lg py-1.5 transition">
                                    <Icons.Plus /> New Snippet
                                </button>
                            </div>
                        )}
                    </div>

                    {/* ── Snippets panel (right) ───────────────────────────── */}
                    <div className="flex-1 flex flex-col min-w-0">
                        {/* Toolbar */}
                        <div className="flex items-center gap-2 px-4 py-2 border-b border-slate-800/60 shrink-0">
                            <div className="relative flex-1">
                                <div className="absolute inset-y-0 left-2.5 flex items-center pointer-events-none text-slate-600"><Icons.Search /></div>
                                <input type="text" value={search} onChange={e => setSearch(e.target.value)}
                                    placeholder="Search snippets…"
                                    className="w-full pl-8 pr-3 py-1.5 bg-[#0a0e17] border border-slate-800 rounded-lg text-xs text-white placeholder-slate-600 focus:border-slate-600 focus:outline-none transition" />
                            </div>
                            <select value={sort} onChange={e => setSort(e.target.value)}
                                className="text-[10px] text-slate-500 bg-[#131B2C] border border-slate-800 rounded px-2 py-1 outline-none cursor-pointer hover:text-slate-300 transition">
                                <option value="recent">Recent</option>
                                <option value="alpha">A–Z</option>
                            </select>
                            <span className="text-[10px] text-slate-600 shrink-0 hidden sm:block">{filtered.length} snippet{filtered.length !== 1 ? 's' : ''}</span>
                            <button onClick={onNew}
                                className="flex items-center gap-1 text-[10px] font-semibold text-white bg-indigo-600 hover:bg-indigo-500 px-2.5 py-1.5 rounded-lg transition shrink-0">
                                <Icons.Plus /><span className="hidden sm:inline">New</span>
                            </button>
                        </div>

                        {/* Category label when filtered */}
                        {activeCat !== 'all' && (
                            <div className="px-4 py-1.5 border-b border-slate-800/40 flex items-center gap-2 shrink-0">
                                <span className="text-[10px] text-slate-500 font-medium">{allCategories.find(c => c.id === activeCat)?.name || 'Unknown'}</span>
                                <span className="text-[9px] text-slate-600">· {filtered.length} snippets</span>
                                <button onClick={() => setActiveCat('all')} className="ml-auto text-[9px] text-slate-600 hover:text-slate-400 transition">Clear ×</button>
                            </div>
                        )}

                        {/* Grid */}
                        <div className="flex-1 overflow-y-auto no-scrollbar p-2">
                            {filtered.length === 0 ? (
                                <div className="py-12 text-center text-slate-600 text-sm">
                                    {search ? `No results for "${search}"` : 'No snippets here yet.'}
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-1">
                                    {filtered.map(s => {
                                        const sCategory = s.category || 'uncategorized';
                                        const catName = allCategories.find(c => c.id === sCategory)?.name || 'Uncategorized';
                                        const restTags = s.tags ? s.tags.slice(0, 3) : [];
                                        const lines = s.content ? s.content.split('\n').filter(l => l.trim()) : [];
                                        const preview = lines.slice(0, 2).join(' · ') || '';
                                        const trimmed = preview.length > 95 ? preview.slice(0, 93) + '…' : preview;
                                        return (
                                            <div key={s.id} onClick={() => onView(s)}
                                                className="group cursor-pointer hover:bg-[#1A2333] border border-transparent hover:border-slate-700/50 rounded-lg px-2.5 py-2 transition-all relative">
                                                {/* Title + category badge */}
                                                <div className="flex items-start gap-2 mb-0.5 pr-16">
                                                    <span className="text-[12px] font-semibold text-slate-200 leading-tight truncate">{s.title || 'Untitled'}</span>
                                                    <span className="text-[8px] font-bold uppercase tracking-wider text-slate-600 shrink-0 mt-px">{catName}</span>
                                                </div>
                                                {/* Content preview */}
                                                {trimmed && <p className="text-[11px] text-slate-500 font-mono leading-tight truncate group-hover:text-slate-400 transition-colors">{trimmed}</p>}
                                                {/* Tags */}
                                                {restTags.length > 0 && (
                                                    <div className="flex gap-1 mt-1">
                                                        {restTags.map(t => <span key={t} className="text-[9px] text-slate-600 font-mono">#{t}</span>)}
                                                    </div>
                                                )}
                                                {/* Hover actions — positioned over top-right */}
                                                <div className="absolute top-1.5 right-1.5 flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity bg-[#131B2C] border border-slate-700/60 rounded-md p-0.5">
                                                    <button onClick={e => { e.stopPropagation(); onCopy(s); }} className="p-1 text-slate-500 hover:text-white rounded transition" title="Copy"><Icons.Copy /></button>
                                                    <button onClick={e => { e.stopPropagation(); onEdit(s); }} className="p-1 text-slate-500 hover:text-white rounded transition" title="Edit"><Icons.Edit /></button>
                                                    <button onClick={e => { e.stopPropagation(); setMoveMenuSnippet(moveMenuSnippet?.id === s.id ? null : s); }} className="p-1 text-slate-500 hover:text-white rounded transition" title="Move"><Icons.Move /></button>
                                                    <button onClick={e => { e.stopPropagation(); onDelete(s); }} className="p-1 text-slate-500 hover:text-red-400 rounded transition" title="Delete"><Icons.Trash /></button>
                                                </div>
                                                {/* Move menu */}
                                                {moveMenuSnippet?.id === s.id && (
                                                    <div className="absolute top-8 right-1.5 bg-[#131B2C] border border-slate-700 rounded-lg shadow-lg z-40 w-32">
                                                        {allCategories.map(cat => (
                                                            <button key={cat.id} onClick={e => {
                                                                e.stopPropagation();
                                                                onMoveSnippet(s.id, cat.id);
                                                                setMoveMenuSnippet(null);
                                                            }} className={`w-full text-left text-xs px-3 py-1.5 transition border-b border-slate-800 last:border-0 ${sCategory === cat.id ? 'bg-indigo-900/30 text-indigo-300' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                                                                {cat.name} {sCategory === cat.id && '✓'}
                                                            </button>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ─── Workspace-first ProjectManager ──────────────────────────────────────
        // Directory view: compact project cards (80-100px) → click opens ProjectWorkspace
        // WorkspaceView: tabbed (Overview | Brand Colors | Snippets | Resources | Sprint Board)

        const ProjectManager = ({ data, onUpdate, showToast, activeProjectId, setActiveProjectId }) => {
            const { projects } = data;

            // workspace state
            const [workspaceProjectId, setWorkspaceProjectId] = useState(() => {
                try { const saved = localStorage.getItem('assetFlowPro_workspaceState'); if (saved) { const parsed = JSON.parse(saved); return parsed.workspaceProjectId || null; } } catch(e) {}
                return null;
            });
            const [workspaceTab, setWorkspaceTab] = useState(() => {
                try { const saved = localStorage.getItem('assetFlowPro_workspaceState'); if (saved) { const parsed = JSON.parse(saved); return parsed.workspaceTab || 'overview'; } } catch(e) {}
                return 'overview';
            });

            // modals
            const [isProjectModalOpen, setIsProjectModalOpen] = useState(false);
            const [editingProject, setEditingProject] = useState(null);
            const [isSnippetModalOpen, setIsSnippetModalOpen] = useState(false);
            const [editingSnippet, setEditingSnippet] = useState(null);
            const [isBookmarkCategoryModalOpen, setIsBookmarkCategoryModalOpen] = useState(false);
            const [editingBookmarkCategory, setEditingBookmarkCategory] = useState(null);
            const [isLinkModalOpen, setIsLinkModalOpen] = useState(false);
            const [editingLink, setEditingLink] = useState(null);
            const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
            const [editingTask, setEditingTask] = useState(null);
            const [viewingCard, setViewingCard] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);
            const [editingColorsFor, setEditingColorsFor] = useState(null);
            const [droppedImage, setDroppedImage] = useState(null);
            const dropZoneRef = useRef(null);
            const [colorPromptFor, setColorPromptFor] = useState(null);
            const [expandedSections, setExpandedSections] = useState({});

            useEffect(() => {
                const handleJump = (e) => {
                    const { projectId, section } = e.detail;
                    // open workspace for the project and jump to the right tab
                    setWorkspaceProjectId(projectId);
                    setActiveProjectId(projectId);
                    const tabMap = { tasks: 'sprint', colors: 'colors', snippets: 'snippets', bookmarks: 'resources', header: 'overview' };
                    setWorkspaceTab(tabMap[section] || 'overview');
                };
                window.addEventListener('jumpToSection', handleJump);
                return () => window.removeEventListener('jumpToSection', handleJump);
            }, [onUpdate]);

            useEffect(() => {
                localStorage.setItem('assetFlowPro_workspaceState', JSON.stringify({ workspaceProjectId, workspaceTab }));
            }, [workspaceProjectId, workspaceTab]);

            useEffect(() => {
                if (workspaceProjectId && !projects.find(p => p.id === workspaceProjectId)) {
                    setWorkspaceProjectId(null);
                    setWorkspaceTab('overview');
                }
            }, [projects, workspaceProjectId]);

            const openWorkspace = (projectId, tab = 'overview') => {
                setWorkspaceProjectId(projectId);
                setActiveProjectId(projectId);
                setWorkspaceTab(tab);
            };
            const closeWorkspace = () => {
                setWorkspaceProjectId(null);
                setWorkspaceTab('overview');
            };

            const toggleSection = (projectId, section) => { const key = `${projectId}_${section}`; setExpandedSections(prev => ({ ...prev, [key]: prev[key] === undefined ? false : !prev[key] })); };
            const isSectionExpanded = (projectId, section) => {
                const key = `${projectId}_${section}`;
                if (section === 'tasks') return expandedSections[key] === true;
                return expandedSections[key] !== false;
            };

            const saveProject = (projData) => { let newProjects; if (projData.id) newProjects = projects.map(p => p.id === projData.id ? { ...p, ...projData } : p); else newProjects = [...projects, { ...projData, id: generateId(), isExpanded: false, colors: [], snippets: [], snippetCategories: [], bookmarks: [], tasks: [], dateAdded: getToday() }]; onUpdate({ ...data, projects: newProjects }); setIsProjectModalOpen(false); setEditingProject(null); };
            const deleteProject = (id) => setConfirmDialog({ message: "Permanently delete this project and all associated assets?", confirmText: "Delete Project", isDestructive: true, onConfirm: () => { onUpdate({ ...data, projects: projects.filter(p => p.id !== id) }); setConfirmDialog(null); } });

            const pickColor = async (projectId) => { if ('EyeDropper' in window) { try { const e = new window.EyeDropper(); const r = await e.open(); insertColor(projectId, r.sRGBHex.toLowerCase()); } catch (e) {} } };
            const insertColor = (projectId, hex) => onUpdate({ ...data, projects: projects.map(p => p.id === projectId ? { ...p, colors: [...p.colors, hex] } : p) });
            const removeColor = (projectId, colorIndex) => onUpdate({ ...data, projects: projects.map(p => p.id === projectId ? { ...p, colors: p.colors.filter((_, i) => i !== colorIndex) } : p) });

            const handleDrop = (e) => { e.preventDefault(); e.stopPropagation(); if(dropZoneRef.current) dropZoneRef.current.classList.remove('border-slate-600', 'bg-slate-800'); const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) { const r = new FileReader(); r.readAsDataURL(f); r.onloadend = () => setDroppedImage(r.result); } };
            const handleDragOver = (e) => { e.preventDefault(); e.stopPropagation(); if(dropZoneRef.current) dropZoneRef.current.classList.add('border-slate-600', 'bg-slate-800'); };
            const handleDragLeave = (e) => { e.preventDefault(); e.stopPropagation(); if(dropZoneRef.current) dropZoneRef.current.classList.remove('border-slate-600', 'bg-slate-800'); };

            const saveSnippet = (sData) => { onUpdate({...data, projects: projects.map(p => p.id === sData.projectId ? {...p, snippets: sData.id ? p.snippets.map(s => s.id === sData.id ? sData : s) : [...p.snippets, {...sData, id: generateId(), dateAdded: getToday()}]} : p)}); setIsSnippetModalOpen(false); setEditingSnippet(null); };
            const deleteSnippet = (pId, sId) => onUpdate({...data, projects: projects.map(p => p.id === pId ? {...p, snippets: p.snippets.filter(s => s.id !== sId)} : p)});
            
            const saveBookmarkCategory = (cData) => { onUpdate({...data, projects: projects.map(p => p.id === cData.projectId ? {...p, bookmarks: cData.id ? p.bookmarks.map(c => c.id === cData.id ? {...c, ...cData} : c) : [...p.bookmarks, { id: generateId(), name: cData.name, description: cData.description, links: [] }]} : p)}); setIsBookmarkCategoryModalOpen(false); setEditingBookmarkCategory(null); };
            const deleteBookmarkCategory = (pId, cId) => setConfirmDialog({ message: "Delete this entire category?", confirmText: "Delete", isDestructive: true, onConfirm: () => { onUpdate({ ...data, projects: projects.map(p => p.id === pId ? { ...p, bookmarks: p.bookmarks.filter(b => b.id !== cId) } : p) }); setConfirmDialog(null); } });
            
            const saveLink = (lData) => { onUpdate({...data, projects: projects.map(p => p.id === lData.projectId ? {...p, bookmarks: p.bookmarks.map(c => c.id === lData.categoryId ? {...c, links: lData.id ? c.links.map(l => l.id === lData.id ? {...l, ...lData} : l) : [...c.links, { id: generateId(), type: lData.type, url: lData.url, description: lData.description, tags: lData.tags, dateAdded: getToday() }]} : c)} : p)}); setIsLinkModalOpen(false); setEditingLink(null); };
            const deleteLink = (pId, cId, lId) => onUpdate({...data, projects: projects.map(p => p.id === pId ? { ...p, bookmarks: p.bookmarks.map(c => c.id === cId ? { ...c, links: c.links.filter(l => l.id !== lId) } : c) } : p)});
            
            const updateTaskStatus = (projectId, taskId, newStatus) => onUpdate({...data, projects: projects.map(p => p.id === projectId ? {...p, tasks: p.tasks.map(t => t.id === taskId ? {...t, status: newStatus} : t)} : p)});
            const saveTask = (tData) => { onUpdate({...data, projects: projects.map(p => p.id === tData.projectId ? {...p, tasks: tData.id ? p.tasks.map(t => t.id === tData.id ? tData : t) : [...(p.tasks||[]), {...tData, id: generateId(), dateAdded: getToday()}]} : p)}); setIsTaskModalOpen(false); setEditingTask(null); };
            const deleteTask = (pId, tId) => { onUpdate({...data, projects: projects.map(p => p.id === pId ? {...p, tasks: p.tasks.filter(t => t.id !== tId)} : p)}); setIsTaskModalOpen(false); setEditingTask(null); };

            // ── active workspace project ─────────────────────────────────────────────
            const activeWsProject = projects.find(p => p.id === workspaceProjectId);

            // ── Workspace view ───────────────────────────────────────────────────────
            if (activeWsProject) {
                const p = activeWsProject;
                const TABS = [
                    { id: 'overview', label: 'Overview' },
                    { id: 'colors',   label: 'Brand Colors', count: p.colors.length },
                    { id: 'snippets', label: 'Snippets',     count: p.snippets.length },
                    { id: 'resources',label: 'Resources',    count: p.bookmarks.reduce((a,c)=>a+c.links.length,0) },
                    { id: 'sprint',   label: 'Sprint Board', count: (p.tasks||[]).length },
                ];
                return (
                    <div className="flex flex-col h-full animate-in">
                        {/* Workspace header */}
                        <div className="flex items-center gap-2 px-4 py-2 border-b border-slate-800/80 shrink-0 bg-[#0B101E]">
                            <button onClick={closeWorkspace} className="p-1 text-slate-500 hover:text-white hover:bg-slate-800 rounded-lg transition" title="Back to Projects"><Icons.ChevronRight /></button>
                            <div className="w-6 h-6 rounded-lg flex items-center justify-center border border-slate-700/50 shrink-0 text-sm" style={{color: p.color, backgroundColor: p.color+'18'}}><Icons.Briefcase /></div>
                            <div className="flex-1 min-w-0">
                                <h2 className="text-xs font-bold text-white tracking-tight truncate">{p.name}</h2>
                            </div>
                            {/* Brand color swatches — quick copy */}
                            {p.colors.length > 0 && (
                                <div className="flex items-center gap-1.5 px-2">
                                    {p.colors.map((c, i) => (
                                        <div key={i} onClick={() => copyToClipboard(c, showToast)}
                                            className="group relative w-4 h-4 rounded-full cursor-pointer border border-slate-700/60 hover:scale-125 hover:border-slate-500 transition-transform shadow-sm"
                                            style={{backgroundColor: c}} title={c}>
                                            <div className="absolute -bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[8px] font-mono px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100 transition whitespace-nowrap border border-slate-700 pointer-events-none">{c}</div>
                                        </div>
                                    ))}
                                </div>
                            )}
                            <div className="flex items-center gap-0.5">
                                <button onClick={() => { setEditingProject(p); setIsProjectModalOpen(true); }} className="p-1 text-slate-500 hover:text-white hover:bg-slate-800 rounded-lg transition"><Icons.Edit /></button>
                                <button onClick={() => { setEditingTask({ projectId: p.id }); setIsTaskModalOpen(true); }} className="flex items-center gap-1 text-[10px] font-semibold text-white bg-indigo-600 hover:bg-indigo-500 px-2.5 py-1 rounded-lg transition shadow-[0_0_10px_rgba(99,102,241,0.3)]"><Icons.Plus /><span>Task</span></button>
                            </div>
                        </div>
                        {/* Tab nav */}
                        <div className="flex items-center gap-0.5 px-4 border-b border-slate-800/80 shrink-0 bg-[#0B101E] overflow-x-auto no-scrollbar">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => setWorkspaceTab(tab.id)}
                                    className={`flex items-center gap-1 px-2.5 py-1.5 text-[11px] font-semibold border-b-2 transition-colors whitespace-nowrap ${workspaceTab === tab.id ? 'border-indigo-500 text-white' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>
                                    {tab.label}
                                    {tab.count !== undefined && <span className={`text-[8px] font-bold px-1 py-0.5 rounded-full ${workspaceTab === tab.id ? 'bg-indigo-500/30 text-indigo-300' : 'bg-slate-800 text-slate-500'}`}>{tab.count}</span>}
                                </button>
                            ))}
                        </div>
                        {/* Tab content */}
                        <div className="flex-1 overflow-y-auto no-scrollbar">

                        {/* Overview tab */}
                        {workspaceTab === 'overview' && (
                            <div className="p-5 space-y-4 max-w-4xl">
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    {[{label:'Tasks', val:(p.tasks||[]).length, sub:`${(p.tasks||[]).filter(t=>t.status==='todo').length} to do`, tab:'sprint', color:'bg-blue-500'},
                                      {label:'Snippets', val:p.snippets.length, sub:'code prompts', tab:'snippets', color:'bg-emerald-500'},
                                      {label:'Resources', val:p.bookmarks.reduce((a,c)=>a+c.links.length,0), sub:'links & dirs', tab:'resources', color:'bg-purple-500'},
                                      {label:'Brand Colors', val:p.colors.length, sub:'swatches', tab:'colors', color:'bg-amber-500'},
                                    ].map(stat => (
                                        <button key={stat.label} onClick={() => setWorkspaceTab(stat.tab)}
                                            className="bg-[#131B2C] border border-slate-800/80 rounded-xl p-4 text-left hover:border-slate-600 transition group">
                                            <div className={`w-2 h-2 rounded-full ${stat.color} mb-3`}></div>
                                            <div className="text-2xl font-bold text-white tracking-tight">{stat.val}</div>
                                            <div className="text-xs font-semibold text-slate-300 mt-0.5">{stat.label}</div>
                                            <div className="text-[10px] text-slate-600 mt-0.5">{stat.sub}</div>
                                        </button>
                                    ))}
                                </div>
                                {/* Color swatches preview */}
                                {p.colors.length > 0 && (
                                    <div className="bg-[#131B2C] border border-slate-800/80 rounded-xl p-4">
                                        <div className="flex items-center justify-between mb-3">
                                            <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Brand Colors</span>
                                            <button onClick={() => setWorkspaceTab('colors')} className="text-[10px] text-slate-500 hover:text-indigo-400 transition">Edit →</button>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {p.colors.map((c,i) => (
                                                <div key={i} onClick={() => copyToClipboard(c, showToast)}
                                                    className="group relative w-8 h-8 rounded-full cursor-pointer border border-slate-700/50 hover:scale-110 transition-transform"
                                                    style={{backgroundColor: c}} title={c}>
                                                    <div className="absolute -top-7 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[9px] font-mono px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100 transition whitespace-nowrap border border-slate-700">{c}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {/* Recent snippets */}
                                {p.snippets.length > 0 && (
                                    <div className="bg-[#131B2C] border border-slate-800/80 rounded-xl p-4">

                    {workspaceTab === 'snippets' && (

                            onEdit={s=>{setEditingSnippet({...s,projectId:p.id});setIsSnippetModalOpen(true);}}
                            onDelete={s=>deleteSnippet(p.id,s.id)}

                                                            <button onClick={()=>{setEditingLink({...link,projectId:p.id,categoryId:cat.id});setIsLinkModalOpen(true);}} className="p-1 text-slate-500 hover:text-white rounded hover:bg-slate-700" title="Edit"><Icons.Edit/></button>
                                                            <button onClick={()=>deleteLink(p.id,cat.id,link.id)} className="p-1 text-slate-500 hover:text-red-400 rounded hover:bg-red-900/20" title="Delete"><Icons.Trash/></button>
                                                        </div>
                                                    </div>

                                            {/* Add Link buttons */}

                                                <button onClick={()=>{setEditingLink({type:'local',projectId:p.id,categoryId:cat.id,url:'',description:'',tags:[]});setIsLinkModalOpen(true);}} className="flex-1 text-xs font-medium text-indigo-400 border border-dashed border-indigo-800/60 hover:border-indigo-500 transition flex justify-center items-center py-2 rounded-lg bg-indigo-900/20 hover:bg-indigo-900/40"><Icons.Folder/><span className="ml-1.5">Local Dir</span></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Brand Colors tab */}
                    {workspaceTab === 'colors' && (

                                    <button onClick={()=>setEditingColorsFor(editingColorsFor===p.id?null:p.id)} className={`text-xs px-3 py-1.5 rounded-lg font-medium transition border ${editingColorsFor===p.id?'bg-indigo-600 text-white border-indigo-500':'bg-slate-800/50 border-slate-700 text-slate-300 hover:bg-slate-700 hover:text-white'}`}>{editingColorsFor===p.id?'Done':'Edit'}</button>

                                    </div>

                                    <div className="flex gap-2 h-16 sm:h-20">

                        {isSnippetModalOpen && <SnippetFormModal card={editingSnippet} categories={activeWsProject?.snippetCategories || []} onClose={()=>{setIsSnippetModalOpen(false);setEditingSnippet(null);}} onSave={saveSnippet} onCreateCategory={(name)=>{const newCat={id:generateId(),name}; onUpdate({...data,projects:projects.map(p=>p.id===activeWsProject.id?{...p,snippetCategories:[...p.snippetCategories,newCat]}:p)});}}/>}
                        {isBookmarkCategoryModalOpen && <BookmarkSubgroupModal subgroup={editingBookmarkCategory} onClose={()=>{setIsBookmarkCategoryModalOpen(false);setEditingBookmarkCategory(null);}} onSave={saveBookmarkCategory}/>}
                        {isLinkModalOpen && <BookmarkLinkModal link={editingLink} onClose={()=>{setIsLinkModalOpen(false);setEditingLink(null);}} onSave={saveLink}/>}

                        {confirmDialog && <ConfirmDialog {...confirmDialog} onCancel={()=>setConfirmDialog(null)}/>}
                    </div>

                            <p className="text-xs text-slate-500 mt-1">{projects.length} workspace{projects.length !== 1 ? 's' : ''}</p>
                        </div>
                        <button onClick={()=>{setEditingProject({name:'',color:'#6366f1'});setIsProjectModalOpen(true);}} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg transition-all shadow-[0_0_15px_rgba(99,102,241,0.3)] font-semibold text-sm">
                            <Icons.Plus/><span className="hidden sm:inline">New Project</span>
                        </button>
                    </div>

                    {projects.length === 0 && (
                        <div className="text-center py-24 bg-[#131B2C] rounded-2xl border border-dashed border-slate-800">

                            <p className="text-sm text-slate-500 mb-5">Create your first project workspace.</p>
                            <button onClick={()=>{setEditingProject({name:'',color:'#6366f1'});setIsProjectModalOpen(true);}} className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition">Create Project</button>
                        </div>

                                        <div className="flex items-start justify-between mb-3">

                                                <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 border border-slate-700/50" style={{color:project.color,backgroundColor:project.color+'18'}}><Icons.Briefcase/></div>
                                                <div className="min-w-0">
                                                    <h3 className="font-bold text-white text-sm tracking-tight truncate">{project.name}</h3>
                                                    <p className="text-[10px] text-slate-600 mt-0.5">{project.dateAdded}</p>

                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3 text-[11px] text-slate-500 mb-3">
                                            <span>{activeTasks > 0 ? <span className="text-blue-400 font-bold">{activeTasks}</span> : taskCount} tasks</span>
                                            <span className="text-slate-700">·</span>
                                            <span>{project.snippets.length} snippets</span>
                                            <span className="text-slate-700">·</span>
                                            <span>{resourceCount} resources</span>
                                        </div>
                                        {project.colors.length > 0 && (
                                            <div className="flex gap-1.5 flex-wrap">
                                                {project.colors.slice(0,7).map((c,i)=>(

                                                ))}

                                            </div>
                                        )}
                                    </div>
                                </div>

                    </div>

                    {isProjectModalOpen && <GroupModal group={editingProject} onClose={()=>{setIsProjectModalOpen(false);setEditingProject(null);}} onSave={saveProject} title="Workspace"/>}
                    {confirmDialog && <ConfirmDialog {...confirmDialog} onCancel={()=>setConfirmDialog(null)}/>}
                </div>
            );
        };

        const SnippetManager = ({ data, onUpdate, showToast }) => {
            const [isSnippetModalOpen, setIsSnippetModalOpen] = useState(false);
            const [editingSnippet, setEditingSnippet] = useState(null);
            const [viewingCard, setViewingCard] = useState(null);

            const saveSnippet = (sData) => {
                if (sData.id) {
                    onUpdate({ ...data, cards: data.cards.map(c => c.id === sData.id ? sData : c) });
                } else {
                    onUpdate({ ...data, cards: [...data.cards, { ...sData, id: generateId(), dateAdded: getToday() }] });
                }
                setIsSnippetModalOpen(false);
            };

            const deleteSnippet = (id) => {
                onUpdate({ ...data, cards: data.cards.filter(c => c.id !== id) });
            };

            return (
                <div className="max-w-[1600px] mx-auto px-4 lg:px-8 py-8 animate-in h-[calc(100vh-64px)] flex flex-col">
                    <div className="flex justify-between items-end border-b border-slate-800/80 pb-3 shrink-0 mb-4">
                        <div>
                            <h2 className="text-3xl font-bold text-white tracking-tight">Code Snippets</h2>
                            <p className="text-slate-400 mt-1">Global code repository.</p>
                        </div>
                        <button onClick={() => { setEditingSnippet({ title: '', content: '', tags: [] }); setIsSnippetModalOpen(true); }} className="flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl transition-all shadow-[0_0_15px_rgba(99,102,241,0.4)] border border-indigo-500/50 premium-active font-semibold">

                        </button>
                    </div>

                                <PremiumSnippetCard key={card.id} card={card} onEdit={() => { setEditingSnippet(card); setIsSnippetModalOpen(true); }} onDelete={() => deleteSnippet(card.id)} onCopy={() => copyToClipboard(card.content, showToast)} onView={() => setViewingCard(card)} sourceLabel="Global" />
                            ))}
                            {data.cards.length === 0 && <div className="col-span-full py-12 text-center border border-dashed border-slate-700 rounded-xl text-slate-500 text-sm bg-[#131B2C]">No global snippets added yet.</div>}
                        </div>
                    </div>
                    {isSnippetModalOpen && <SnippetFormModal card={editingSnippet} groups={data.groups} onClose={() => setIsSnippetModalOpen(false)} onSave={saveSnippet} />}
                    {viewingCard && <ViewModal card={viewingCard} onClose={() => setViewingCard(null)} onCopy={() => copyToClipboard(viewingCard.content, showToast)} />}
                </div>
            );
        };

        const PaletteManager = ({ data, onUpdate, showToast }) => {
            return (
                <div className="max-w-[1600px] mx-auto px-4 lg:px-8 py-8 animate-in h-[calc(100vh-64px)] flex flex-col">
                    <div className="flex justify-between items-end border-b border-slate-800/80 pb-3 shrink-0 mb-4">
                        <div>
                            <h2 className="text-3xl font-bold text-white tracking-tight">Brand Palettes</h2>
                            <p className="text-slate-400 mt-1">Manage global color palettes.</p>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto pb-20 no-scrollbar space-y-6">
                        {data.palettes.map(palette => (
                             <div key={palette.id} className="bg-[#131B2C] rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.5)] border border-slate-800/80 p-6 transition-all hover:border-slate-700">
                                 <div className="flex justify-between items-center mb-6">
                                     <h3 className="text-xl font-bold text-white tracking-tight">{palette.name}</h3>
                                     <button onClick={() => copyAllColors(palette.colors, 'css', showToast)} className="text-xs px-3 py-1.5 rounded-md font-medium bg-slate-800/50 border border-slate-700 text-slate-300 hover:bg-slate-700 hover:text-white transition-colors">
                                         Copy All Hex
                                     </button>
                                 </div>
                                 <div className="flex flex-wrap gap-4 bg-[#0a0e17] p-6 rounded-xl border border-slate-800/60">
                                     {palette.colors.map((c, i) => (
                                         <div key={i} className="w-20 h-20 group relative premium-hover cursor-pointer" onClick={() => copyToClipboard(c, showToast)}>
                                            <div className="w-full h-full rounded-full shadow-sm relative overflow-hidden border border-slate-700/50 flex items-center justify-center" style={{ backgroundColor: c }}>
                                                <div className="opacity-0 group-hover:opacity-100 transition-opacity bg-black/40 backdrop-blur-sm w-full h-full flex items-center justify-center text-white"><Icons.Copy /></div>
                                            </div>
                                            <div className="mt-2 text-center text-xs font-mono text-slate-400 font-medium uppercase tracking-wide">{c}</div>
                                         </div>
                                     ))}
                                 </div>
                             </div>
                        ))}
                        {data.palettes.length === 0 && <div className="py-12 text-center border border-dashed border-slate-700 rounded-xl text-slate-500 text-sm bg-[#131B2C]">No global palettes found.</div>}
                    </div>
                </div>
